name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Only for the tenant-isolation suite (apps/web/test/tenant-isolation.test.ts),
      # which needs real Prisma query semantics. Every other test uses fakes.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sla_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Build-time only — nothing here sends real mail. The only database
      # connection is the tenant-isolation suite's, via TEST_DATABASE_URL;
      # DATABASE_URL stays a placeholder that nothing connects to.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      TEST_DATABASE_URL: "postgresql://ci:ci@localhost:5432/sla_test?schema=public"
      NEXTAUTH_SECRET: "ci-nextauth-secret"
      NEXTAUTH_URL: "http://localhost:5465"
      INTEGRATION_CONFIG_ENCRYPTION_KEY: "ci-integration-config-encryption-key"
      SMTP_ENCRYPTION_KEY: "ci-smtp-encryption-key"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sla/db generate

      - name: Type-check
        run: pnpm type-check

      - name: Migrate test database
        run: pnpm test:db:prepare

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build web app
        run: pnpm web:build

      - name: Build worker app
        run: pnpm worker:build
