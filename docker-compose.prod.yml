# Self-host/VPS production stack: Postgres + the two application
# containers built from apps/web/Dockerfile and apps/worker/Dockerfile.
# See docs/deployment.md for the full walkthrough, including the one-off
# `prisma migrate deploy` step this file intentionally does not run for you.
#
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: SLA
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sla_breach_monitoring}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      # Loopback only by default: the reverse proxy on this host is the one
      # public entry point. Reaching `web` directly would skip TLS and let a
      # caller forge X-Forwarded-For for the rate limiter. Set WEB_BIND=0.0.0.0
      # only if the proxy runs on another host, and firewall the port.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      INTEGRATION_CONFIG_ENCRYPTION_KEY: ${INTEGRATION_CONFIG_ENCRYPTION_KEY:?INTEGRATION_CONFIG_ENCRYPTION_KEY is required}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:?SMTP_ENCRYPTION_KEY is required}
      # Reverse proxies between the internet and `web` (see apps/web/src/lib/rate-limit.ts).
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      # All optional (roadmap step 29) — an empty SENTRY_DSN just disables
      # the SDK, see apps/web/sentry.server.config.ts.
      SENTRY_DSN: ${SENTRY_DSN:-}

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    # Not published to the host: nothing outside this container needs to
    # reach the liveness endpoint directly, only the Dockerfile's own
    # HEALTHCHECK (curl/wget over localhost inside the container). Add a
    # `ports:` mapping here yourself if an external uptime monitor should
    # poll it directly.
    expose:
      - "${WORKER_HEALTH_PORT:-8081}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      INTEGRATION_CONFIG_ENCRYPTION_KEY: ${INTEGRATION_CONFIG_ENCRYPTION_KEY:?INTEGRATION_CONFIG_ENCRYPTION_KEY is required}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:?SMTP_ENCRYPTION_KEY is required}
      WORKER_ACTIVE_POLL_MS: ${WORKER_ACTIVE_POLL_MS:-300000}
      WORKER_RECONCILIATION_MS: ${WORKER_RECONCILIATION_MS:-3600000}
      # All optional (roadmap step 29) — see .env.example's "Observability"
      # section and docs/deployment.md's "Health checks and observability".
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8081}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPS_ALERT_SLACK_WEBHOOK_URL: ${OPS_ALERT_SLACK_WEBHOOK_URL:-}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      OPS_ALERT_SMTP_HOST: ${OPS_ALERT_SMTP_HOST:-}
      OPS_ALERT_SMTP_PORT: ${OPS_ALERT_SMTP_PORT:-587}
      OPS_ALERT_SMTP_SECURITY: ${OPS_ALERT_SMTP_SECURITY:-starttls}
      OPS_ALERT_SMTP_USER: ${OPS_ALERT_SMTP_USER:-}
      OPS_ALERT_SMTP_PASSWORD: ${OPS_ALERT_SMTP_PASSWORD:-}
      OPS_ALERT_SMTP_FROM: ${OPS_ALERT_SMTP_FROM:-}

volumes:
  postgres-data:
